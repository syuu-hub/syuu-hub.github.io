<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>タクシーアナライザーへ移動しました</title>
<!-- 旧URL（/taxi-board/）から新URL（/taxi-analyzer/）へ転送する。記録は同じサイト内に保存されているのでそのまま引き継がれる -->
<meta http-equiv="refresh" content="0; url=../taxi-analyzer/">
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (/\/taxi-board\/$/.test(r.scope)) r.unregister(); })).catch(() => {});
  location.replace('../taxi-analyzer/' + location.search + location.hash);
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0C0F;color:#ECEFF3;font-family:system-ui,sans-serif;text-align:center;padding:24px}a{color:#FFB020}</style>
</head>
<body>
<p>タクシーアナライザーは新しいURLに移動しました。<br><a href="../taxi-analyzer/">こちらから開いてください</a></p>
</body>
</html>
