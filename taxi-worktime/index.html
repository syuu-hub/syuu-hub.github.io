<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="タクシードライバー向けの労働時間管理。シフトカレンダーで予定と実績の労働時間を管理し、改善基準告示の拘束時間・休息期間を自動でチェックします。">
<title>拘束時間チェッカー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="拘束時間">
<style>
/* ============================================================
   Design tokens（タクシーアナライザー・乗り場ルールと共通）
   ============================================================ */
:root{
  --bg:#0A0C0F;
  --surface:#12151A;
  --surface-2:#191D24;
  --surface-3:#212630;
  --line:#242A33;
  --line-2:#343C48;
  --text:#ECEFF3;
  --muted:#8C96A4;
  --faint:#5A6472;

  --accent:#FFB020;
  --accent-ink:#1E1400;
  --accent-soft:rgba(255,176,32,.14);

  --lv-ok:#3DD68C;
  --lv-ng:#FF5D5D;
  --lv-warn:#FFB020;
  --lv-unk:#5B9BFF;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --pad:16px;

  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;overflow:hidden;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none !important}
svg{display:block}

/* ---------- Layout ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.view{
  min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) 40px max(var(--pad),env(safe-area-inset-left));
}
.view-body{max-width:640px;margin:0 auto}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:8px}
.view-head h2{font-size:22px;font-weight:800}

.tabbar{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  border-top:1px solid var(--line);background:var(--surface);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tab-btn{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab-btn svg{width:24px;height:24px}
.tab-btn[aria-current="page"]{color:var(--accent)}
.tab-btn[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* ---------- 共通パーツ ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.card + .card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:15px;font-weight:700;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--lv-ng);border-color:rgba(255,93,93,.4)}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:19px;font-weight:800;border-radius:18px}
.btn svg{width:22px;height:22px}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:42px;border-radius:10px;font-size:15px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:24px;height:24px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 8px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 11px;border-radius:14px;font-size:13px;font-weight:800;line-height:1.35;max-width:100%;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.lv-ok{--c:var(--lv-ok)} .lv-ng{--c:var(--lv-ng)} .lv-warn{--c:var(--lv-warn)} .lv-unk{--c:var(--lv-unk)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--muted);white-space:nowrap}

.bar{position:relative;height:14px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:16px 0 6px}
.bar > span{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--c,var(--lv-ok));transition:width .4s}
.bar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--bg);opacity:.9}
.bar-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:10px 8px;text-align:center}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
.actions{display:grid;gap:10px;margin-top:14px}
.actions.two{grid-template-columns:1fr 1fr}
.alerts{display:grid;gap:8px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:14px;line-height:1.5;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.alert::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:800;font-size:17px;text-align:right}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.month-head b{font-size:26px;font-weight:900}

/* ---------- 記録 ---------- */
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .m{font-size:17px;font-weight:800;min-width:96px;text-align:center}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.list{display:grid;gap:8px}
.shift{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.shift .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shift .date{font-weight:800;font-size:16px}
.shift .time{color:var(--muted);font-size:14px}
.shift .row2{display:flex;gap:14px;margin-top:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.shift .row2 b{color:var(--text)}
.shift .warns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.shift.ng{border-color:rgba(255,93,93,.45)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* ---------- カレンダー ---------- */
.sum-big{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.sum-big b{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.sum-big span{color:var(--muted);font-weight:700}
.bar.stack > span + span{background:var(--lv-unk);opacity:.75}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.sum3 .v{font-size:18px}
.cal{margin-top:12px;padding:12px 10px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-week div{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:6px}
.cal-week div:first-child,.cal-day .n.sun{color:var(--lv-ng)}
.cal-week div:last-child,.cal-day .n.sat{color:var(--lv-unk)}
.cal-day{position:relative;min-height:58px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 7px;min-width:0}
.cal-day .n{font-size:12px;font-weight:700;color:var(--text);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cal-day.today .n{background:var(--accent);color:var(--accent-ink) !important}
.cal-day .h{font-size:13px;font-weight:800;white-space:nowrap}
.cal-day .h small{font-size:9px;opacity:.7;margin-left:1px}
.cal-day.actual .h{color:var(--lv-ok)}
.cal-day.plan .h{color:var(--lv-unk);opacity:.8}
.cal-day.plan.virtual .h{opacity:.45}
.cal-day.off .h,.cal-day.ake .h{color:var(--muted);font-size:12px}
.cal-day.off.virtual .h{opacity:.4}
.cal-day.lv-ng{border-color:rgba(255,93,93,.6)}
.cal-day.lv-warn{border-color:rgba(255,176,32,.5)}
.cal-day .streak{position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--lv-ng);color:#fff;font-size:9px;font-weight:900;display:grid;place-items:center}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 4px 0;font-size:12px;color:var(--muted)}
.cal-legend b{font-weight:800}
.daybig{display:flex;align-items:baseline;gap:6px}
.daybig b{font-size:44px;font-weight:900;line-height:1.1}
.calc{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.calc .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.calc .row b{font-size:24px;font-weight:900}
.calc .warns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;color:var(--muted)}
.daychips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daychips.off{opacity:.4;pointer-events:none}

/* ---------- シート（編集） ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.field{display:grid;gap:6px;margin-top:14px}
.field > span{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:16px}
textarea.input{padding:10px 14px;min-height:72px;resize:vertical}
.sheet .actions{margin-top:20px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid .input{min-width:0}
.input:disabled{opacity:.4}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.preview{margin-top:14px;padding:10px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.preview .kv{padding:4px 0 8px}
.preview .warns{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-2);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* ---------- ルール説明 ---------- */
.rules h4{font-size:15px;font-weight:800;margin:14px 0 6px}
.rules h4:first-child{margin-top:0}
.rules ul{padding-left:1.2em;font-size:14px;color:var(--muted);display:grid;gap:4px}
.rules ul b{color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view"><div class="view-body" id="body"></div></main>
  <nav class="tabbar" aria-label="画面切り替え">
    <button class="tab-btn" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg>カレンダー</button>
    <button class="tab-btn" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>設定</button>
  </nav>
</div>
<div id="sheet-root"></div>
<!-- ファイル選択は描き直す範囲の外に置く（スマホではファイル選択から戻ると画面を描き直すため、中に置くと選んだファイルが届かない） -->
<input type="file" id="restore-file" hidden>

<script>
'use strict';
/* ============================================================
   データ
   ============================================================ */
const KEY = 'taxi-worktime-v1';
const H = 3600e3, M = 60e3;
const TYPES = { day: '日勤', alt: '隔勤' };

// 改善基準告示（タクシー・2024年4月施行）の基準値
const RULES = {
  day: { warn: 13 * H, max: 15 * H, over14: 14 * H, restMin: 9 * H, restGoal: 11 * H, month: 288 },
  alt: { max: 22 * H, avg2: 21 * H, restMin: 22 * H, restGoal: 24 * H, month: 262 }
};

let S = load();
function defaults() {
  return { v: 2, settings: { type: 'day', monthLimit: null, defaultHours: 11, fixedOffEnabled: false, fixedOffDays: [] }, shifts: [], plans: {} };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return defaults();
}
// 古い形式（v1）のデータも読めるように足りない項目を補う
function normalize(d) {
  const base = defaults(), st = { ...base.settings, ...(d.settings || {}) };
  if (st.monthLimit == null && st.type === 'alt' && +st.altMonth === 270) st.monthLimit = 270;
  delete st.altMonth; delete st.notify;
  return { ...base, ...d, v: 2, settings: st, shifts: Array.isArray(d.shifts) ? d.shifts : [], plans: d.plans && typeof d.plans === 'object' ? d.plans : {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存できませんでした（ブラウザの保存領域を確認してください）'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sorted = () => S.shifts.slice().sort((a, b) => a.start - b.start);
const monthLimit = () => +S.settings.monthLimit || RULES[S.settings.type].month;

/* ============================================================
   計算
   ============================================================ */
const endOf = (s, now) => s.end ?? now;
const kousoku = (s, now = Date.now()) => Math.max(0, endOf(s, now) - s.start);

// 日勤の「1日」は始業から24時間。その間に次の勤務が始まった分も、その日の拘束に数える
function dayKousoku(s, list, now = Date.now()) {
  const w0 = s.start, w1 = s.start + 24 * H;
  return list.reduce((t, x) => t + Math.max(0, Math.min(endOf(x, now), w1) - Math.max(x.start, w0)), 0);
}
// 1勤務ごとのチェック結果 [{lv:'ng'|'warn', t:'…'}]
function check(s, list, now = Date.now()) {
  const out = [], i = list.indexOf(s), prev = list[i - 1], type = s.type || 'day';
  const k = kousoku(s, now);
  if (type === 'day') {
    const dk = dayKousoku(s, list, now);
    if (dk > RULES.day.max) out.push({ lv: 'ng', t: `1日の拘束 ${hm(dk)}（上限15時間超）` });
    else if (dk > RULES.day.warn) out.push({ lv: 'warn', t: `1日の拘束 ${hm(dk)}（13時間超）` });
    if (dk > k + M) out.push({ lv: 'warn', t: `次の勤務が24時間以内に開始（${hm(dk - k)}を重複して算入）` });
  } else {
    if (k > RULES.alt.max) out.push({ lv: 'ng', t: `拘束 ${hm(k)}（隔勤の上限22時間超）` });
    const p = list.slice(0, i).reverse().find(x => (x.type || 'day') === 'alt');
    if (p && s.end != null && (k + kousoku(p, now)) / 2 > RULES.alt.avg2) out.push({ lv: 'ng', t: `前回との平均 ${hm((k + kousoku(p, now)) / 2)}（2回平均21時間超）` });
  }
  if (prev && prev.end != null) {
    const r = s.start - prev.end, R = RULES[type];
    if (r < 0) out.push({ lv: 'ng', t: '前の勤務と時間が重なっています' });
    else if (r < R.restMin) out.push({ lv: 'ng', t: `休息 ${hm(r)}（${R.restMin / H}時間未満）` });
    else if (r < R.restGoal) out.push({ lv: 'warn', t: `休息 ${hm(r)}（目標${R.restGoal / H}時間に届かず）` });
  }
  return out;
}

function monthKey(t) { const d = new Date(t); return d.getFullYear() * 100 + d.getMonth() + 1; }
/* ---------- シフトカレンダー：日ごとの状態 ----------
   actual = 確定（実際の勤務の記録あり） / plan = 予定 / off = 公休 / ake = 隔勤の明け番 / none = 記録なし
   予定を入れていない日は、今日以降なら「目安労働時間の出勤予定」、固定休みの曜日なら「公休」とみなす */
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const defMs = () => (+S.settings.defaultHours || 11) * H;
// 予定の出庫・帰庫（"HH:MM"）を日時に。帰庫が出庫以前なら翌日とみなす
function planSpan(key, p) {
  if (!p || !p.start || !p.end) return null;
  const s = new Date(`${key}T${p.start}`).getTime(); let e = new Date(`${key}T${p.end}`).getTime();
  while (e <= s) e += 24 * H;
  return { start: s, end: e };
}
const planMs = (key, p) => { const sp = planSpan(key, p); return sp ? sp.end - sp.start : defMs(); };
function daysRange(from, to, now = Date.now()) {
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const all = sorted(), byDay = {};
  for (const s of all) (byDay[dkey(new Date(s.start))] ||= []).push(s);
  const out = [];
  let prevAlt = false;
  for (const d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const key = dkey(d), date = new Date(d), sh = byDay[key], p = S.plans[key];
    let info;
    if (sh) {
      const checks = sh.flatMap(s => check(s, all, now));
      info = { kind: 'actual', ms: sh.reduce((t, s) => t + kousoku(s, now), 0), shifts: sh, active: sh.some(s => s.end == null), checks,

    else if (S.settings.fixedOffEnabled && (S.settings.fixedOffDays || []).includes(date.getDay())) info = { kind: 'off', virtual: true };

        <div class="muted small" style="font-weight:700">労働時間（${TYPES[s.type || 'day']}）</div>
        <div class="daybig num"><b>${hdec(kousoku(s, now))}</b><span class="muted">時間</span><span class="muted small" style="margin-left:auto">${hm(kousoku(s, now))}</span></div>
        <div class="kv"><span class="k">出庫〜帰庫</span><span class="v num">${hhmm(s.start)} 〜 ${s.end == null ? '未入力' : (nd ? '翌' : '') + hhmm(s.end)}</span></div>
        ${c.length ? `<div class="warns">${c.map(x => `<span class="pill lv-${x.lv}"><i></i>${esc(x.t)}</span>`).join('')}</div>` : '<span class="pill lv-ok"><i></i>基準内です</span>'}
        ${s.note ? `<div class="small muted" style="margin-top:8px">${esc(s.note)}</div>` : ''}
      </div>`;
    }).join('') + `<div class="actions">${info.active ? '' : '<button class="btn big block" data-act="d-unlock">編集モードにする</button>'}
      ${info.shifts.length === 1 ? `<button class="btn${info.active ? ' primary big' : ''} block" data-edit="${info.shifts[0].id}">日時・メモを細かく編集</button>` : ''}</div>`;
  } else {
    const work = e.type === 'work';
    bodyHtml = `<div class="seg" role="group" aria-label="出勤・公休"><button data-act="d-type" data-v="work" aria-pressed="${work}">出勤</button><button data-act="d-type" data-v="off" aria-pressed="${!work}">公休</button></div>
      ${work ? `<div class="seg" role="group" aria-label="勤務形態" style="margin-top:10px">${Object.entries(TYPES).map(([k, v]) => `<button data-act="d-wtype" data-v="${k}" aria-pressed="${k === e.wtype}">${v}</button>`).join('')}</div>
      <div class="tgrid">
        <label class="field"><span>出庫</span><input class="input num" type="time" id="d-start" value="${e.start}"></label>
        <label class="field"><span>帰庫</span><input class="input num" type="time" id="d-end" value="${e.end}"></label>
      </div>
      <div class="calc" id="d-calc"></div>` : `<div class="calc"><span class="muted">この日は公休として記録します。</span></div>`}
      <div class="actions">${work
        ? `<div class="actions two" style="margin-top:0"><button class="btn big" data-act="d-plan">予定保存</button><button class="btn primary big" data-act="d-confirm">確定して保存</button></div>`
        : '<button class="btn primary big block" data-act="d-off">公休で保存</button>'}
        ${S.plans[e.key] ? '<button class="btn block" data-act="d-clear">入力した予定を消す</button>' : ''}</div>`;
  }
  document.getElementById('sheet-root').innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-label="${DAYNAME(date)}の勤務">
    <h3><span>${DAYNAME(date)}</span>${x}</h3>
    <div style="margin:-4px 0 12px">${status}</div>${streak}${bodyHtml}</div></div>`;
  updateDayCalc();
}
// 出庫・帰庫から労働時間を自動計算し、確定したときの基準チェックも先に見せる
function updateDayCalc() {
  const el = document.getElementById('d-calc'); if (!el || !dayEdit) return;
  const e = dayEdit;
  e.start = document.getElementById('d-start').value; e.end = document.getElementById('d-end').value;
  const sp = planSpan(e.key, e);
  if (!sp) { el.innerHTML = `<div class="row"><span class="muted small" style="font-weight:700">自動計算</span><span class="muted">時刻が未入力のときは目安 <b class="num" style="font-size:18px;color:var(--text)">${hdec(defMs())}</b>h</span></div>`; return; }
  const draft = { id: '_draft', type: e.wtype, start: sp.start, end: sp.end };
  const list = sorted().filter(s => !(dayEdit.info.shifts || []).includes(s)).concat(draft).sort((a, b) => a.start - b.start);
  const c = check(draft, list), nd = new Date(sp.end).toDateString() !== new Date(sp.start).toDateString();
  el.innerHTML = `<div class="row"><span class="muted small" style="font-weight:700">自動計算${nd ? '<span class="tag" style="color:var(--accent);margin-left:6px">帰庫は翌日</span>' : ''}</span><span class="num"><b>${hdec(sp.end - sp.start)}</b> h</span></div>
    <div class="warns">${c.length ? c.map(x => `<span class="pill lv-${x.lv}"><i></i>${esc(x.t)}</span>`).join('') : '<span class="pill lv-ok"><i></i>基準内です</span>'}</div>`;
}
function dayAction(act, v) {
  const e = dayEdit, now = Date.now(); if (!e) return;
  const keepTimes = () => { const a = document.getElementById('d-start'), b = document.getElementById('d-end'); if (a) e.start = a.value; if (b) e.end = b.value; };
  switch (act) {
    case 'd-type': keepTimes(); e.type = v; renderDay(); break;
    case 'd-wtype': keepTimes(); e.wtype = v; renderDay(); break;
    case 'd-off': S.plans[e.key] = { type: 'off' }; save(); closeEditor(); render(); toast('公休で保存しました'); break;
    case 'd-clear': delete S.plans[e.key]; save(); closeEditor(); render(); toast('予定を消しました'); break;
    case 'd-plan':
      keepTimes();
      if ((e.start && !e.end) || (!e.start && e.end)) return toast('出庫と帰庫の両方を入れるか、両方を空にしてください');
      S.plans[e.key] = { type: 'work', wtype: e.wtype, start: e.start, end: e.end }; save(); closeEditor(); render(); toast('予定を保存しました'); break;
    case 'd-confirm': {
      keepTimes();
      const sp = planSpan(e.key, e);
      if (!sp) return toast('確定するには出庫と帰庫の時刻を入れてください');
      if (sp.end > now) return toast('帰庫がまだ先の勤務は確定できません。いまは「予定保存」をしておき、帰庫したあとに確定してください');
      if (S.shifts.some(x => x.start < sp.end && (x.end ?? now) > sp.start)) return toast('ほかの勤務と時間が重なっています');
      S.shifts.push({ id: uid(), type: e.wtype, start: sp.start, end: sp.end, note: e.note || '' });
      delete S.plans[e.key]; save(); closeEditor(); render(); toast(`確定しました（${hdec(sp.end - sp.start)}h）`); break;
    }
    case 'd-unlock': {
      if (!confirm('確定を解除して編集しますか？（時刻は予定として残ります）')) return;
      const s = e.info.shifts.find(x => x.end != null); if (!s) return;
      S.plans[e.key] = { type: 'work', wtype: s.type || 'day', start: hhmm(s.start), end: hhmm(s.end), note: s.note || '' };
      const ids = e.info.shifts.filter(x => x.end != null).map(x => x.id);
      S.shifts = S.shifts.filter(x => !ids.includes(x.id)); save(); render(); openDay(e.key, true); break;
    }
  }
}

/* ============================================================
   操作
   ============================================================ */
document.querySelector('.tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; render(); document.getElementById('view').scrollTop = 0;
});

document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed) { dayEdit = null; return openEditor(ed.dataset.edit); }
  const dd = e.target.closest('[data-day]'); if (dd) return openDay(dd.dataset.day);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, now = Date.now();
  if (act === 'close' && e.target !== el && el.classList.contains('sheet-bg')) return; // シートの中のタップは閉じない
  if (act.startsWith('d-')) return dayAction(act, v);
  switch (act) {
    case 'type': S.settings.type = v; S.settings.monthLimit = null; save(); render(); break;
    case 'fixoff': S.settings.fixedOffEnabled = v === '1'; save(); render(); break;
    case 'fixday': {
      const list = S.settings.fixedOffDays = S.settings.fixedOffDays || [], i = list.indexOf(+v);
      if (i >= 0) list.splice(i, 1); else list.push(+v); save(); render(); break;
    }
    case 'mnow': viewMonth = monthKey(now); render(); break;
    case 'kintai': importKintai(kintaiData()); break;
    case 'mprev': case 'mnext': {
      let y = Math.floor(viewMonth / 100), m = viewMonth % 100 + (act === 'mnext' ? 1 : -1);
      if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      viewMonth = y * 100 + m; render(); break;
    }
    case 'add': openEditor(null); break;
    case 'close': closeEditor(); break;
    case 'etype': readEditor(); editing.type = v; reopen(); break;
    case 'esave': saveEditor(false); break;
    case 'esave-next': saveEditor(true); break;
    case 'edel':
      if (!confirm('この勤務を削除しますか？')) return;
      S.shifts = S.shifts.filter(x => x.id !== editing.id); save(); closeEditor(); render(); toast('削除しました'); break;
    case 'csv': exportCsv(); break;
    case 'backup': download(`taxi-worktime-backup-${fileDate()}.json`, JSON.stringify(S), 'application/json'); break;
    case 'restore': document.getElementById('restore-file').click(); break;
    case 'wipe':
      if (!confirm('すべての記録を削除します。元に戻せません。よろしいですか？')) return;
      S.shifts = []; S.plans = {}; save(); render(); toast('削除しました'); break;
  }
});
// 編集シートを、いまの editing の内容で描き直す
function reopen() { openEditor(null, editing); }

document.addEventListener('input', e => { if (e.target.closest('.sheet')) { if (dayEdit) updateDayCalc(); else updatePreview(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'set-defh') { const v = +e.target.value; S.settings.defaultHours = v > 0 && v <= 24 ? v : 11; save(); render(); }
  if (e.target.id === 'set-limit') { const v = Math.round(+e.target.value); S.settings.monthLimit = v > 0 ? v : null; save(); render(); }
});
document.getElementById('restore-file').addEventListener('change', e => {
  const input = e.target, f = input.files[0]; if (!f) return;
  f.text().then(t => {
    t = t.replace(/^﻿/, '');
    if (/^\s*\{/.test(t)) {
      const d = JSON.parse(t);
      if (d && d.records && d.config) return importKintai(d);
      if (!d || !Array.isArray(d.shifts)) throw new Error('拘束時間チェッカーのバックアップではありません');
      if (!confirm(`${d.shifts.length}件の記録を読み込みます。いまの記録は置き換わります。よろしいですか？`)) return;
      S = normalize(d);
      save(); tab = 'cal'; viewMonth = monthKey(Date.now()); render(); toast(`${d.shifts.length}件を読み込みました`);
    } else {
      const add = shiftsFromAnalyzerCsv(t);
      if (!add.length) throw new Error('出庫・入庫の記録が見つかりませんでした');
      const fresh = add.filter(n => !S.shifts.some(x => x.start < (n.end ?? Date.now()) && (x.end ?? Date.now()) > n.start));
      if (!fresh.length) return toast('すべて読み込み済みです');
      if (!confirm(`CSVから${fresh.length}件の勤務を追加します${add.length > fresh.length ? `（すでにある${add.length - fresh.length}件は飛ばします）` : ''}。よろしいですか？`)) return;
      S.shifts.push(...fresh); save(); tab = 'cal'; viewMonth = monthKey(fresh[fresh.length - 1].start); render(); toast(`${fresh.length}件を追加しました`);
    }
  }).catch(err => toast('読み込めませんでした：' + (err && err.message && !/JSON|token/i.test(err.message) ? err.message : 'ファイルの形式が違います')))
    .finally(() => { input.value = ''; });
});

// 勤怠管理アプリ（トップページ）のデータ。同じサイトなのでこの端末の保存内容を直接読める
function kintaiData() {
  try { const d = JSON.parse(localStorage.getItem('taxishift_md3_v40_data') || localStorage.getItem('taxishift_md3_v39_data') || 'null'); return d && d.records && Object.keys(d.records).length ? d : null; }
  catch (e) { return null; }
}
// 勤怠管理アプリの記録 → 確定した出勤は勤務の記録、それ以外は予定・公休として取り込む（すでにある日は上書きしない）
function importKintai(d) {
  if (!d) return;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const shifts = [], plans = {}; let skip = 0;
  for (const [k, r] of Object.entries(d.records || {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !r) continue;
    if (r.type === 'off') { if (!S.plans[k]) plans[k] = { type: 'off' }; else skip++; continue; }
    if (r.type !== 'work') continue;
    const sp = planSpan(k, { start: r.startTime, end: r.endTime });
    if (r.isConfirmed && sp && sp.end <= Date.now()) {
      if (S.shifts.some(x => x.start < sp.end && (x.end ?? Date.now()) > sp.start)) { skip++; continue; }
      shifts.push({ id: uid(), type: S.settings.type, start: sp.start, end: sp.end, note: '' });
    } else if (!S.plans[k]) plans[k] = { type: 'work', wtype: S.settings.type, start: r.startTime || '', end: r.endTime || '' };
    else skip++;
  }
  const np = Object.keys(plans).length;
  if (!shifts.length && !np) return toast('取り込める新しい記録はありませんでした');
  if (!confirm(`勤怠管理アプリから、確定 ${shifts.length}日・予定と公休 ${np}日 を取り込みます${skip ? `（すでにある${skip}日は飛ばします）` : ''}。固定休み・目安労働時間・月間上限の設定も引き継ぎます。よろしいですか？`)) return;
  S.shifts.push(...shifts); Object.assign(S.plans, plans);
  const c = d.config || {};
  if (Array.isArray(c.fixedOffDays)) { S.settings.fixedOffEnabled = !!c.fixedOffEnabled; S.settings.fixedOffDays = c.fixedOffDays.map(Number); }
  if (+c.defaultHours > 0) S.settings.defaultHours = +c.defaultHours;
  if (+c.maxHours > 0) S.settings.monthLimit = +c.maxHours;
  save(); tab = 'cal'; viewMonth = monthKey(Date.now()); render(); toast('取り込みました');
}

// CSV を行・列に分ける（"…" で囲まれた値の中のカンマ・改行に対応）
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
// タクシーアナライザーの記録CSV → 勤務（「出庫」で始業、「入庫」で終業。入庫がなければその営業日の最後の記録で終業）
function shiftsFromAnalyzerCsv(text) {
  const rows = parseCsv(text), head = rows.shift() || [];
  const col = n => head.indexOf(n), iT = col('日時'), iD = col('営業日'), iK = col('種別'), iS = col('ステータス'), iN = col('備考');
  if ([iT, iD, iK, iS].includes(-1)) throw new Error('タクシーアナライザーの記録CSVではありません');
  const time = v => { const m = /(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(v || ''); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime() : NaN; };
  const days = new Map();
  for (const r of rows) {
    const t = time(r[iT]); if (!isFinite(t) || !r[iD]) continue;
    const d = days.get(r[iD]) || { start: null, end: null, last: t }; days.set(r[iD], d);
    d.last = Math.max(d.last, t);
    if (r[iK] === 'ステータス' && /^出庫/.test(r[iN] || '')) d.start = t;
    if (r[iK] === 'ステータス' && r[iS] === '入庫') d.end = t;
  }
  return [...days.entries()].filter(([, d]) => d.start != null).sort((a, b) => a[1].start - b[1].start).map(([k, d]) => ({
    id: uid(), type: 'day', start: d.start, end: d.end ?? (d.last > d.start ? d.last : null),
    note: d.end == null ? '入庫の記録なし（最後の記録の時刻を終業としています）' : ''
  })).filter(s => s.end != null);
}

function fileDate() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; }
function download(name, text, type = 'text/csv') {
  const url = URL.createObjectURL(new Blob([type === 'text/csv' ? '﻿' + text : text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportCsv() {
  const list = sorted(), now = Date.now(), fmt = t => t == null ? '' : `${new Date(t).getFullYear()}/${pad(new Date(t).getMonth() + 1)}/${pad(new Date(t).getDate())} ${hhmm(t)}`;
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['勤務形態', '始業', '終業', '拘束時間', 'チェック結果', 'メモ']];
  for (const s of list) rows.push([TYPES[s.type || 'day'], fmt(s.start), fmt(s.end), hm(kousoku(s, now)), check(s, list, now).map(c => (c.lv === 'ng' ? '違反:' : '注意:') + c.t).join(' / '), s.note || '']);
  download(`taxi-worktime-${fileDate()}.csv`, rows.map(r => r.map(q).join(',')).join('\r\n'));
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && !editing && !dayEdit) render(); });
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
