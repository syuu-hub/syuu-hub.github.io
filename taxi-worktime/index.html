<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="タクシードライバー向けの労働時間管理。始業・終業をワンタップで記録し、改善基準告示の拘束時間・休息期間を自動でチェックします。">
<title>拘束時間チェッカー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="拘束時間">
<style>
/* ============================================================
   Design tokens（タクシーアナライザー・乗り場ルールと共通）
   ============================================================ */
:root{
  --bg:#0A0C0F;
  --surface:#12151A;
  --surface-2:#191D24;
  --surface-3:#212630;
  --line:#242A33;
  --line-2:#343C48;
  --text:#ECEFF3;
  --muted:#8C96A4;
  --faint:#5A6472;

  --accent:#FFB020;
  --accent-ink:#1E1400;
  --accent-soft:rgba(255,176,32,.14);

  --lv-ok:#3DD68C;
  --lv-ng:#FF5D5D;
  --lv-warn:#FFB020;
  --lv-unk:#5B9BFF;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --pad:16px;

  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;overflow:hidden;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none !important}
svg{display:block}

/* ---------- Layout ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.view{
  min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) 40px max(var(--pad),env(safe-area-inset-left));
}
.view-body{max-width:640px;margin:0 auto}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:8px}
.view-head h2{font-size:22px;font-weight:800}

.tabbar{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--line);background:var(--surface);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tab-btn{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab-btn svg{width:24px;height:24px}
.tab-btn[aria-current="page"]{color:var(--accent)}
.tab-btn[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab-btn .dot{position:absolute;top:10px;left:calc(50% + 10px);width:10px;height:10px;border-radius:50%;background:var(--lv-ok)}

/* ---------- 共通パーツ ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.card + .card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:15px;font-weight:700;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--lv-ng);border-color:rgba(255,93,93,.4)}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:19px;font-weight:800;border-radius:18px}
.btn svg{width:22px;height:22px}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:42px;border-radius:10px;font-size:15px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:24px;height:24px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 8px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 11px;border-radius:14px;font-size:13px;font-weight:800;line-height:1.35;max-width:100%;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.lv-ok{--c:var(--lv-ok)} .lv-ng{--c:var(--lv-ng)} .lv-warn{--c:var(--lv-warn)} .lv-unk{--c:var(--lv-unk)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--muted);white-space:nowrap}

/* ---------- いま（タイマー） ---------- */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.clock{font-size:15px;color:var(--muted)}
.timer{text-align:center;padding:22px 18px 18px}
.timer .label{font-size:14px;font-weight:700;color:var(--muted)}
.timer .big{font-size:clamp(52px,16vw,76px);font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px}
.timer .sub{font-size:14px;color:var(--muted)}
.timer .sub b{color:var(--text)}
.bar{position:relative;height:14px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:16px 0 6px}
.bar > span{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--c,var(--lv-ok));transition:width .4s}
.bar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--bg);opacity:.9}
.bar-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:10px 8px;text-align:center}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
.actions{display:grid;gap:10px;margin-top:14px}
.actions.two{grid-template-columns:1fr 1fr}
.alerts{display:grid;gap:8px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:14px;line-height:1.5;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.alert::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:800;font-size:17px;text-align:right}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.month-head b{font-size:26px;font-weight:900}

/* ---------- 記録 ---------- */
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .m{font-size:17px;font-weight:800;min-width:96px;text-align:center}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.list{display:grid;gap:8px}
.shift{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.shift .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shift .date{font-weight:800;font-size:16px}
.shift .time{color:var(--muted);font-size:14px}
.shift .row2{display:flex;gap:14px;margin-top:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.shift .row2 b{color:var(--text)}
.shift .warns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.shift.ng{border-color:rgba(255,93,93,.45)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* ---------- シート（編集） ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.field{display:grid;gap:6px;margin-top:14px}
.field > span{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:16px}
textarea.input{padding:10px 14px;min-height:72px;resize:vertical}
.sheet .actions{margin-top:20px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid .input{min-width:0}
.input:disabled{opacity:.4}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.preview{margin-top:14px;padding:10px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.preview .kv{padding:4px 0 8px}
.preview .warns{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-2);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* ---------- ルール説明 ---------- */
.rules h4{font-size:15px;font-weight:800;margin:14px 0 6px}
.rules h4:first-child{margin-top:0}
.rules ul{padding-left:1.2em;font-size:14px;color:var(--muted);display:grid;gap:4px}
.rules ul b{color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view"><div class="view-body" id="body"></div></main>
  <nav class="tabbar" aria-label="画面切り替え">
    <button class="tab-btn" data-tab="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>いま<span class="dot" id="dot" hidden></span></button>
    <button class="tab-btn" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/></svg>記録</button>
    <button class="tab-btn" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>設定</button>
  </nav>
</div>
<div id="sheet-root"></div>
<!-- ファイル選択は描き直す範囲の外に置く（スマホではファイル選択から戻ると画面を描き直すため、中に置くと選んだファイルが届かない） -->
<input type="file" id="restore-file" hidden>

<script>
'use strict';
/* ============================================================
   データ
   ============================================================ */
const KEY = 'taxi-worktime-v1';
const H = 3600e3, M = 60e3;
const TYPES = { day: '日勤', alt: '隔勤' };

// 改善基準告示（タクシー・2024年4月施行）の基準値
const RULES = {
  day: { warn: 13 * H, max: 15 * H, over14: 14 * H, restMin: 9 * H, restGoal: 11 * H, month: 288 },
  alt: { max: 22 * H, avg2: 21 * H, restMin: 22 * H, restGoal: 24 * H, month: 262 }
};

let S = load();
function defaults() {
  return { v: 1, settings: { type: 'day', altMonth: 262, notify: false }, shifts: [] };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); const base = defaults(); return { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } }; }
  } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存できませんでした（ブラウザの保存領域を確認してください）'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sorted = () => S.shifts.slice().sort((a, b) => a.start - b.start);
const active = () => S.shifts.find(s => s.end == null);
const monthLimit = () => S.settings.type === 'alt' ? (+S.settings.altMonth || 262) : RULES.day.month;

/* ============================================================
   計算
   ============================================================ */
const endOf = (s, now) => s.end ?? now;
const kousoku = (s, now = Date.now()) => Math.max(0, endOf(s, now) - s.start);

// 日勤の「1日」は始業から24時間。その間に次の勤務が始まった分も、その日の拘束に数える
function dayKousoku(s, list, now = Date.now()) {
  const w0 = s.start, w1 = s.start + 24 * H;
  return list.reduce((t, x) => t + Math.max(0, Math.min(endOf(x, now), w1) - Math.max(x.start, w0)), 0);
}
// 1勤務ごとのチェック結果 [{lv:'ng'|'warn', t:'…'}]
function check(s, list, now = Date.now()) {
  const out = [], i = list.indexOf(s), prev = list[i - 1], type = s.type || 'day';
  const k = kousoku(s, now);
  if (type === 'day') {
    const dk = dayKousoku(s, list, now);
    if (dk > RULES.day.max) out.push({ lv: 'ng', t: `1日の拘束 ${hm(dk)}（上限15時間超）` });
    else if (dk > RULES.day.warn) out.push({ lv: 'warn', t: `1日の拘束 ${hm(dk)}（13時間超）` });
    if (dk > k + M) out.push({ lv: 'warn', t: `次の勤務が24時間以内に開始（${hm(dk - k)}を重複して算入）` });
  } else {
    if (k > RULES.alt.max) out.push({ lv: 'ng', t: `拘束 ${hm(k)}（隔勤の上限22時間超）` });
    const p = list.slice(0, i).reverse().find(x => (x.type || 'day') === 'alt');
    if (p && s.end != null && (k + kousoku(p, now)) / 2 > RULES.alt.avg2) out.push({ lv: 'ng', t: `前回との平均 ${hm((k + kousoku(p, now)) / 2)}（2回平均21時間超）` });
  }
  if (prev && prev.end != null) {
    const r = s.start - prev.end, R = RULES[type];
    if (r < 0) out.push({ lv: 'ng', t: '前の勤務と時間が重なっています' });
    else if (r < R.restMin) out.push({ lv: 'ng', t: `休息 ${hm(r)}（${R.restMin / H}時間未満）` });
    else if (r < R.restGoal) out.push({ lv: 'warn', t: `休息 ${hm(r)}（目標${R.restGoal / H}時間に届かず）` });
  }
  return out;
}

function monthKey(t) { const d = new Date(t); return d.getFullYear() * 100 + d.getMonth() + 1; }
function monthStats(mk, now = Date.now()) {
  const list = sorted(), ms = list.filter(s => monthKey(s.start) === mk);
  const r = { n: ms.length, k: 0, max: 0, ng: 0, warn: 0, over14: 0, list: ms, all: list };
  const weeks = {};
  for (const s of ms) {
    const k = kousoku(s, now); r.k += k; r.max = Math.max(r.max, k);
    const c = check(s, list, now);
    r.ng += c.filter(x => x.lv === 'ng').length; r.warn += c.filter(x => x.lv === 'warn').length;
    if ((s.type || 'day') === 'day' && dayKousoku(s, list, now) > RULES.day.over14) {
      r.over14++; const wk = weekKey(s.start); weeks[wk] = (weeks[wk] || 0) + 1;
    }
  }
  r.weekOver = Object.values(weeks).some(n => n > 3);
  return r;
}
function weekKey(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

/* ============================================================
   表示用の書式
   ============================================================ */
const pad = n => String(n).padStart(2, '0');
function hm(ms) { const neg = ms < 0; ms = Math.abs(ms); const m = Math.floor(ms / M); return (neg ? '-' : '') + Math.floor(m / 60) + ':' + pad(m % 60); }
function hms(ms) { const s = Math.floor(Math.max(0, ms) / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const WD = '日月火水木金土';
const md = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
function whenStr(t, now = Date.now()) {
  const a = new Date(t), b = new Date(now); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
  const diff = Math.round((a - b) / 864e5);
  return (diff === 0 ? '今日 ' : diff === 1 ? '明日 ' : diff === 2 ? 'あさって ' : diff === -1 ? '昨日 ' : md(t) + ' ') + hhmm(t);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toLocalInput = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.append(el);
  setTimeout(() => el.remove(), 2600);
}

/* ============================================================
   画面
   ============================================================ */
let tab = 'now', viewMonth = monthKey(Date.now());
const body = document.getElementById('body');

function render() {
  document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.getElementById('dot').hidden = !active();
  body.innerHTML = tab === 'now' ? viewNow() : tab === 'log' ? viewLog() : viewSettings();
}

function viewNow(now = Date.now()) {
  const a = active(), list = sorted();
  const clock = `<div class="status"><span class="clock num">${md(now)} ${hhmm(now)}</span>${a ? '<span class="pill lv-ok"><i></i>乗務中</span>' : '<span class="pill lv-unk" style="--c:var(--muted)"><i></i>休息中</span>'}</div>`;
  let main;
  if (a) {
    const type = a.type || 'day', k = kousoku(a, now);
    const lim = type === 'day' ? RULES.day.max : RULES.alt.max, soft = type === 'day' ? RULES.day.warn : null;
    const used = type === 'day' ? dayKousoku(a, list, now) : k;
    const pct = Math.min(100, used / lim * 100);
    const color = used > lim ? 'var(--lv-ng)' : soft && used > soft ? 'var(--lv-warn)' : lim - used < H ? 'var(--lv-warn)' : 'var(--lv-ok)';
    const alerts = [];
    if (used > lim) alerts.push(['ng', `拘束時間が上限（${lim / H}時間）を ${hm(used - lim)} 超えています。すぐに終業してください。`]);
    else if (soft && used > soft) alerts.push(['warn', `13時間を超えました（14時間超は週3回までが目安）。上限15時間まであと ${hm(lim - used)}。`]);
    else if (lim - used < H) alerts.push(['warn', `上限まであと ${hm(lim - used)} です。帰庫の準備をしてください。`]);
    const prev = list[list.indexOf(a) - 1];
    if (prev && (prev.type || 'day') === 'day' && prev.start + 24 * H > a.start) {
      const pk = dayKousoku(prev, list, now), pend = prev.start + 24 * H;
      if (pk > RULES.day.max) alerts.push(['ng', `前回の始業から24時間以内のため、前回の「1日」の拘束が ${hm(pk)} になっています（上限15時間超）。`]);
      else if (now < pend) alerts.push(['unk', `${hhmm(pend)} までは前回の「1日」の拘束にも算入されます（いま ${hm(pk)} / 15時間）。`]);
    }
    main = `<div class="card">
      <div class="timer">
        <div class="label">${TYPES[type]}・拘束時間（${hhmm(a.start)} 始業）</div>
        <div class="big num" id="tick">${hms(k)}</div>
        <div class="sub num">上限 ${lim / H}時間まで <b>${hm(lim - used)}</b>・終業リミット <b>${whenStr(a.start + lim - (used - k), now)}</b></div>
        <div class="bar"><span style="width:${pct}%;--c:${color}"></span>${soft ? `<i class="mark" style="left:${soft / lim * 100}%"></i>` : ''}</div>

  } else {
    const last = list.filter(s => s.end != null).pop(), type = S.settings.type, R = RULES[type];
    let restHtml = '';
    if (last) {
      const rest = now - last.end, minOk = last.end + R.restMin, goal = last.end + R.restGoal;

      restHtml = `<div class="timer">
        <div class="label">休息時間（前回 ${whenStr(last.end, now)} 終業）</div>
        <div class="big num" id="tick">${hms(rest)}</div>
        <div class="bar"><span style="width:${Math.min(100, rest / R.restGoal * 100)}%;--c:var(--lv-${lv})"></span><i class="mark" style="left:${R.restMin / R.restGoal * 100}%"></i></div>

      </div>

      <div class="kv"><span class="k">目標の休息（${R.restGoal / H}時間）</span><span class="v num">${whenStr(goal, now)}</span></div>
      ${lv === 'ng' ? `<div class="alerts"><div class="alert lv-ng">休息が${R.restMin / H}時間に満たないため、まだ始業できません（あと ${hm(minOk - now)}）。</div></div>` : ''}`;
    } else {
      restHtml = `<div class="timer"><div class="label">記録はまだありません</div><div class="sub" style="margin-top:8px">出庫するときに「始業」を押すと、拘束時間の計測が始まります。</div></div>`;
    }
    main = `<div class="card">${restHtml}
      <div class="seg" style="margin-top:14px" role="group" aria-label="勤務形態">
        ${Object.entries(TYPES).map(([k, v]) => `<button data-act="type" data-v="${k}" aria-pressed="${k === type}">${v}</button>`).join('')}

  const mcolor = kh > lim ? 'var(--lv-ng)' : kh > lim * .9 ? 'var(--lv-warn)' : 'var(--lv-ok)';

  return `<div class="view-head"><h2>拘束時間チェッカー</h2></div>${clock}${main}${month}`;
}

/* ============================================================
   編集シート
   ============================================================ */
let editing = null;
// 新しく追加するときの初期値：同じ勤務形態の前回と同じ時刻、なければ標準的な時刻
function newDraft(dayOffset) {
  const type = S.settings.type, last = sorted().filter(x => x.end != null && (x.type || 'day') === type).pop();
  const base = new Date(); base.setHours(0, 0, 0, 0);
  if (dayOffset != null) base.setTime(dayOffset);
  const [sh, sm, dur] = last ? [new Date(last.start).getHours(), new Date(last.start).getMinutes(), last.end - last.start]
    : type === 'alt' ? [7, 0, 20 * H] : [8, 0, 11 * H];
  const st = new Date(base); st.setHours(sh, sm, 0, 0);
  return { id: uid(), type, start: st.getTime(), end: st.getTime() + dur, note: '', _new: true };
}
const toDateInput = t => toLocalInput(t).slice(0, 10);
function openEditor(id, draft) {
  const src = id ? S.shifts.find(s => s.id === id) : null;
  const s = draft || (src ? JSON.parse(JSON.stringify(src)) : newDraft());
  editing = s;
  const canActive = s.end === null || !S.shifts.some(x => x.end == null && x.id !== s.id);
  document.getElementById('sheet-root').innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-label="勤務の編集">
    <h3>${s._new ? '勤務を手入力' : '勤務を編集'}<button class="icon-btn" data-act="close" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="seg" role="group">${Object.entries(TYPES).map(([k, v]) => `<button data-act="etype" data-v="${k}" aria-pressed="${k === (s.type || 'day')}">${v}</button>`).join('')}</div>
    <label class="field"><span>勤務日（始業した日）</span><input class="input num" type="date" id="e-date" value="${toDateInput(s.start)}"></label>
    <div class="tgrid">
      <label class="field"><span>始業</span><input class="input num" type="time" id="e-start" value="${hhmm(s.start)}"></label>
      <label class="field"><span>終業</span><input class="input num" type="time" id="e-end" value="${s.end != null ? hhmm(s.end) : ''}"${s.end === null ? ' disabled' : ''}></label>
    </div>
    ${canActive ? `<label class="check"><input type="checkbox" id="e-active"${s.end === null ? ' checked' : ''}> まだ終業していない（乗務中）</label>` : ''}
    <div class="preview" id="e-preview"></div>
    <label class="field"><span>メモ</span><textarea class="input" id="e-note" placeholder="営業所・車番など">${esc(s.note)}</textarea></label>
    <div class="actions">${s._new ? `<div class="actions two" style="margin-top:0"><button class="btn primary big" data-act="esave">保存</button><button class="btn big" data-act="esave-next">保存して次へ</button></div>` : '<button class="btn primary big block" data-act="esave">保存</button>'}
      ${s._new ? '' : '<button class="btn danger block" data-act="edel">この勤務を削除</button>'}</div>
  </div></div>`;
  updatePreview();
}
// 編集中の入力値を editing に読み込む（終業の時刻が始業以前なら翌日の終業とみなす）
function readEditor() {
  const s = editing, v = id => document.getElementById(id)?.value || '';
  const d = v('e-date'), st = v('e-start'), en = v('e-end'), act = document.getElementById('e-active')?.checked;
  s.start = d && st ? new Date(`${d}T${st}`).getTime() : NaN;
  if (act) s.end = null;
  else if (en && isFinite(s.start)) { let e = new Date(`${d}T${en}`).getTime(); while (e <= s.start) e += 24 * H; s.end = e; }
  else s.end = undefined;
  s.note = v('e-note').trim();
  delete s.breaks;
}
function updatePreview() {
  const el = document.getElementById('e-preview'); if (!el || !editing) return;
  readEditor();
  const s = editing, endIn = document.getElementById('e-end'), act = document.getElementById('e-active')?.checked;
  if (endIn) endIn.disabled = !!act;
  if (!isFinite(s.start)) { el.innerHTML = '<span class="muted">勤務日と始業時刻を入れてください</span>'; return; }
  if (s.end === undefined) { el.innerHTML = '<span class="muted">終業時刻を入れてください</span>'; return; }
  const list = sorted().filter(x => x.id !== s.id).concat(s).sort((a, b) => a.start - b.start), c = check(s, list);
  const nextDay = s.end != null && new Date(s.end).toDateString() !== new Date(s.start).toDateString();
  el.innerHTML = `<div class="kv"><span class="k">${s.end == null ? '乗務中' : `終業 ${nextDay ? '<b class="tag" style="color:var(--accent)">翌日</b> ' : ''}${md(s.end)} ${hhmm(s.end)}`}</span><span class="v num">拘束 ${hm(kousoku(s))}</span></div>
    ${c.length ? `<div class="warns">${c.map(x => `<span class="pill lv-${x.lv}"><i></i>${esc(x.t)}</span>`).join('')}</div>` : '<span class="pill lv-ok"><i></i>基準内です</span>'}`;
}
function closeEditor() { editing = null; document.getElementById('sheet-root').innerHTML = ''; }
function saveEditor(next) {
  readEditor();
  const s = editing;
  if (!isFinite(s.start)) return toast('勤務日と始業時刻を入力してください');
  if (s.end === undefined) return toast('終業時刻を入力してください');
  if (s.end == null && s.start > Date.now()) return toast('乗務中にする勤務は、始業を現在より前にしてください');
  if (s.end == null && S.shifts.some(x => x.end == null && x.id !== s.id)) return toast('乗務中の勤務がほかにあります。終業を入力してください');
  if (S.shifts.some(x => x.id !== s.id && x.start < (s.end ?? Date.now()) && (x.end ?? Date.now()) > s.start)) return toast('ほかの勤務と時間が重なっています');
  delete s._new;
  const i = S.shifts.findIndex(x => x.id === s.id);
  if (i >= 0) S.shifts[i] = s; else S.shifts.push(s);
  save(); render();
  if (next && s.end != null) {
    // 次の勤務日：日勤は翌日、隔勤は明け番を挟んで2日後
    const d = new Date(s.start); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + ((s.type || 'day') === 'alt' ? 2 : 1));
    const n = newDraft(d.getTime()); n.type = s.type || 'day';
    const st = new Date(d); st.setHours(new Date(s.start).getHours(), new Date(s.start).getMinutes()); n.start = st.getTime(); n.end = n.start + (s.end - s.start);
    openEditor(null, n); toast(`保存しました。続けて ${md(n.start)} を入力できます`);
  } else { closeEditor(); toast('保存しました'); }
}

/* ============================================================
   操作
   ============================================================ */
document.querySelector('.tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; render(); document.getElementById('view').scrollTop = 0;
});

document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed) return openEditor(ed.dataset.edit);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, now = Date.now(), a = active();
  if (act === 'close' && e.target !== el && el.classList.contains('sheet-bg')) return; // シートの中のタップは閉じない
  switch (act) {
    case 'start': {
      if (S.shifts.some(x => x.end != null && x.end > now)) return toast('終業が現在より後の勤務があります。記録を修正してください');
      const last = sorted().filter(s => s.end != null).pop(), R = RULES[S.settings.type];
      if (last && now - last.end < R.restMin && !confirm(`前回の終業から ${hm(now - last.end)} しか経っていません（休息は${R.restMin / H}時間以上が必要）。それでも始業しますか？`)) return;
      S.shifts.push({ id: uid(), type: S.settings.type, start: now, end: null, note: '' });
      notified = {}; save(); render(); toast('始業しました。安全運転で！'); break;
    }
    case 'end':
      if (!a || !confirm('終業（帰庫）しますか？')) return;
      a.end = now; save(); render(); toast(`おつかれさまでした。拘束 ${hm(kousoku(a))}`); break;
    case 'type': S.settings.type = v; save(); render(); break;
    case 'altmonth': S.settings.altMonth = +v; save(); render(); break;
    case 'notify':
      S.settings.notify = v === '1'; save(); render();
      if (S.settings.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
      break;
    case 'mprev': case 'mnext': {
      let y = Math.floor(viewMonth / 100), m = viewMonth % 100 + (act === 'mnext' ? 1 : -1);
      if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      viewMonth = y * 100 + m; render(); break;
    }
    case 'add': openEditor(null); break;
    case 'close': closeEditor(); break;
    case 'etype': readEditor(); editing.type = v; reopen(); break;
    case 'esave': saveEditor(false); break;
    case 'esave-next': saveEditor(true); break;
    case 'edit-active': if (a) openEditor(a.id); break;
    case 'edel':
      if (!confirm('この勤務を削除しますか？')) return;
      S.shifts = S.shifts.filter(x => x.id !== editing.id); save(); closeEditor(); render(); toast('削除しました'); break;
    case 'csv': exportCsv(); break;
    case 'backup': download(`taxi-worktime-backup-${fileDate()}.json`, JSON.stringify(S), 'application/json'); break;
    case 'restore': document.getElementById('restore-file').click(); break;
    case 'wipe':
      if (!confirm('すべての記録を削除します。元に戻せません。よろしいですか？')) return;
      S.shifts = []; save(); render(); toast('削除しました'); break;
  }
});
// 編集シートを、いまの editing の内容で描き直す
function reopen() { openEditor(null, editing); }

document.addEventListener('input', e => { if (e.target.closest('.sheet')) updatePreview(); });
document.addEventListener('change', e => { if (e.target.id === 'e-active') updatePreview(); });
document.getElementById('restore-file').addEventListener('change', e => {
  const input = e.target, f = input.files[0]; if (!f) return;
  f.text().then(t => {
    t = t.replace(/^﻿/, '');
    if (/^\s*\{/.test(t)) {
      const d = JSON.parse(t);
      if (!d || !Array.isArray(d.shifts)) throw new Error('拘束時間チェッカーのバックアップではありません');
      if (!confirm(`${d.shifts.length}件の記録を読み込みます。いまの記録は置き換わります。よろしいですか？`)) return;
      const base = defaults(); S = { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
      save(); tab = 'log'; viewMonth = monthKey(Date.now()); render(); toast(`${d.shifts.length}件を読み込みました`);
    } else {
      const add = shiftsFromAnalyzerCsv(t);
      if (!add.length) throw new Error('出庫・入庫の記録が見つかりませんでした');
      const fresh = add.filter(n => !S.shifts.some(x => x.start < (n.end ?? Date.now()) && (x.end ?? Date.now()) > n.start));
      if (!fresh.length) return toast('すべて読み込み済みです');
      if (!confirm(`CSVから${fresh.length}件の勤務を追加します${add.length > fresh.length ? `（すでにある${add.length - fresh.length}件は飛ばします）` : ''}。よろしいですか？`)) return;
      S.shifts.push(...fresh); save(); tab = 'log'; viewMonth = monthKey(fresh[fresh.length - 1].start); render(); toast(`${fresh.length}件を追加しました`);
    }
  }).catch(err => toast('読み込めませんでした：' + (err && err.message && !/JSON|token/i.test(err.message) ? err.message : 'ファイルの形式が違います')))
    .finally(() => { input.value = ''; });
});

// CSV を行・列に分ける（"…" で囲まれた値の中のカンマ・改行に対応）
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
// タクシーアナライザーの記録CSV → 勤務（「出庫」で始業、「入庫」で終業。入庫がなければその営業日の最後の記録で終業）
function shiftsFromAnalyzerCsv(text) {
  const rows = parseCsv(text), head = rows.shift() || [];
  const col = n => head.indexOf(n), iT = col('日時'), iD = col('営業日'), iK = col('種別'), iS = col('ステータス'), iN = col('備考');
  if ([iT, iD, iK, iS].includes(-1)) throw new Error('タクシーアナライザーの記録CSVではありません');
  const time = v => { const m = /(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(v || ''); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime() : NaN; };
  const days = new Map();
  for (const r of rows) {
    const t = time(r[iT]); if (!isFinite(t) || !r[iD]) continue;
    const d = days.get(r[iD]) || { start: null, end: null, last: t }; days.set(r[iD], d);
    d.last = Math.max(d.last, t);
    if (r[iK] === 'ステータス' && /^出庫/.test(r[iN] || '')) d.start = t;
    if (r[iK] === 'ステータス' && r[iS] === '入庫') d.end = t;
  }
  return [...days.entries()].filter(([, d]) => d.start != null).sort((a, b) => a[1].start - b[1].start).map(([k, d]) => ({
    id: uid(), type: 'day', start: d.start, end: d.end ?? (d.last > d.start ? d.last : null),
    note: d.end == null ? '入庫の記録なし（最後の記録の時刻を終業としています）' : ''
  })).filter(s => s.end != null);
}

function fileDate() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; }
function download(name, text, type = 'text/csv') {
  const url = URL.createObjectURL(new Blob([type === 'text/csv' ? '﻿' + text : text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportCsv() {
  const list = sorted(), now = Date.now(), fmt = t => t == null ? '' : `${new Date(t).getFullYear()}/${pad(new Date(t).getMonth() + 1)}/${pad(new Date(t).getDate())} ${hhmm(t)}`;
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['勤務形態', '始業', '終業', '拘束時間', 'チェック結果', 'メモ']];
  for (const s of list) rows.push([TYPES[s.type || 'day'], fmt(s.start), fmt(s.end), hm(kousoku(s, now)), check(s, list, now).map(c => (c.lv === 'ng' ? '違反:' : '注意:') + c.t).join(' / '), s.note || '']);
  download(`taxi-worktime-${fileDate()}.csv`, rows.map(r => r.map(q).join(',')).join('\r\n'));
}

/* ============================================================
   毎秒の更新とお知らせ
   ============================================================ */
let notified = {}, lastMinute = -1;
function notify(key, msg) {
  if (notified[key]) return; notified[key] = true;
  toast(msg); try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
  if (S.settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    navigator.serviceWorker?.getRegistration().then(r => r ? r.showNotification('拘束時間チェッカー', { body: msg, icon: 'icons/icon-192.png', tag: key }) : new Notification('拘束時間チェッカー', { body: msg })).catch(() => {});
  }
}
setInterval(() => {
  const now = Date.now(), a = active();
  if (editing) return;
  const minute = Math.floor(now / M);
  if (tab === 'now' && minute !== lastMinute) { lastMinute = minute; const st = document.getElementById('view').scrollTop; render(); document.getElementById('view').scrollTop = st; }
  else if (tab === 'now') { const el = document.getElementById('tick'); if (el) { const last = sorted().filter(s => s.end != null).pop(); el.textContent = hms(a ? kousoku(a, now) : last ? now - last.end : 0); } }
  if (!a) return;
  const type = a.type || 'day', used = type === 'day' ? dayKousoku(a, sorted(), now) : kousoku(a, now), lim = RULES[type].max;
  const key = a.id + ':';
  if (used > lim) notify(key + 'over', `拘束時間が上限の${lim / H}時間を超えました`);
  else if (lim - used <= 30 * M) notify(key + '30', `拘束時間の上限まであと30分です`);
  else if (lim - used <= H) notify(key + '60', `拘束時間の上限まであと1時間です`);
  if (type === 'day' && used > RULES.day.warn) notify(key + '13', '拘束時間が13時間を超えました');
}, 1000);
// 起動時点ですでに過ぎている通知はまとめて出さない
(() => { const a = active(); if (!a) return; const now = Date.now(), type = a.type || 'day', used = type === 'day' ? dayKousoku(a, sorted(), now) : kousoku(a, now), lim = RULES[type].max, k = a.id + ':';
  if (used > lim) notified[k + 'over'] = true; if (lim - used <= 30 * M) notified[k + '30'] = true; if (lim - used <= H) notified[k + '60'] = true; if (used > RULES.day.warn) notified[k + '13'] = true; })();

document.addEventListener('visibilitychange', () => { if (!document.hidden && !editing) render(); });
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
