# 一時的：ページの中身を確認する（確認が済んだら消す）
name: events-probe
on:
  push:
    branches: [claude/taxi-board-app-ncbt4x]
    paths: ['events-probe/urls.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node events-probe/probe.mjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add events-probe/out
          git commit -m "events-probe: pages" || exit 0
          git push
