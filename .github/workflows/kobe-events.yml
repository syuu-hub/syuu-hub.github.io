# 神戸の主要会場のイベント情報を毎日1回集めて taxi-analyzer/events.json を更新する
name: kobe-events
on:
  schedule:
    - cron: '17 19 * * *'   # 毎日 4:17（日本時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: kobe-events
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node taxi-analyzer-events/fetch-events.mjs
      - name: 変わっていれば保存
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add taxi-analyzer/events.json
          git diff --cached --quiet && exit 0
          git commit -m "神戸の会場イベント情報を更新"
          git push
